name: Build and release Windows portable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build portable exe
        run: npm run dist

      # Starts the packaged app and fails the build if the page doesn't come up (renderer errors,
      # a script that didn't load, nothing clickable). The screenshot and log are printed below.
      - name: Startup check (packaged app)
        shell: bash
        run: |
          export W2X_SMOKE="$PWD/smoke.png"
          timeout 120 "dist/win-unpacked/Waifu2x Batch.exe" || code=$?
          cat smoke.log || echo "no smoke log written"
          test -z "$code" || { echo "Startup check failed (exit $code)"; exit 1; }

      - name: Read version
        id: ver
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # Every push to main publishes the version in package.json as a release (v<version>).
      # Pushing a v* tag does the same. Re-running for the same version replaces its exe.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Waifu2x Batch v${{ steps.ver.outputs.version }}
          files: dist/*.exe
          overwrite_files: true
